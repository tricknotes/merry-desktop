<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設定</title>
  </head>
  <body>
    <main>
      <h1>設定</h1>
      <p class="status">状態: <span id="status" data-status="stopped">停止中</span></p>
      <p id="status-detail" class="detail"></p>
      <form id="settings">
        <label>
          CPU数
          <input id="cpus" name="cpus" type="number" min="1" step="1" placeholder="既定" />
        </label>
        <label>
          メモリ(MiB)
          <input id="memory" name="memory" type="number" min="1024" step="512" placeholder="既定" />
        </label>
        <label>
          ディスク上限(GiB)
          <input id="disk" name="disk" type="number" min="16" step="1" placeholder="既定" />
        </label>
        <p class="hint">空欄は既定値(WSL が決める値)です。CPU数とメモリは、ほかの WSL ディストリにも反映されます。</p>
        <button type="submit">保存</button>
      </form>
      <p id="message" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
