# Lint, test and build with the Makefile, using the same Go and Node.js
# versions as the local builder image (build/dev/Dockerfile). The toolchains
# come from setup-go / setup-node so that their caches make repeated runs fast;
# builder-image.yml checks the image itself when it changes.
name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in sync with build/dev/Dockerfile.
  GO_VERSION: "1.27.4"
  NODE_VERSION: "26.13.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: make all
        run: make all
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-binaries
          path: bin/

  # Runs the Go tests on Windows, including the code that only works there
  # (named pipes, the registry, the Windows certificate store). GitHub's Windows
  # runners have no Smart App Control, so unsigned test binaries run.
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # The packages embed the built frontend and the engine-agent, but the
      # tests only need the files to exist; the real ones are built (and the
      # app with them) by the build job.
      - name: Placeholder embedded files
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>test</title>' > frontend/dist/index.html
          echo 'placeholder' | gzip -n > internal/vm/wsl/assets/engine-agent.gz
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -v ./internal/...
      - name: Build the app natively
        run: go build -o merry-desktop.exe ./cmd/merry-desktop
